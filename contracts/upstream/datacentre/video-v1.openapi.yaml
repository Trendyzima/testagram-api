openapi: 3.1.0
info:
  title: Testagram Data Centre Video Service
  version: "1.0.0"
  description: |
    Private Backend-to-Data-Centre video service contract. The Backend forwards
    the authenticated native Testagram user token; the Data Centre independently
    validates the user/session and enforces video ownership before deletion.
paths:
  /v1/videos/{video_id}:
    delete:
      operationId: deleteOwnedVideo
      summary: Delete an owned video and its associated records and media
      description: |
        Idempotent for an authenticated caller: an already absent video returns
        204. A video owned by another account is returned as not found. Deletion
        is refused while the video is uploading, queued, processing, or has an
        active video job. The video row and dependent engagement/job records are
        removed transactionally; original, HLS and poster directories are
        removed after commit.
      security:
        - testagramNativeBearer: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Video deleted or already absent
        "401":
          description: Native Testagram session is missing or invalid
        "404":
          description: Video does not exist or is owned by another account
        "409":
          description: Upload or transcoding work is still active
        "500":
          description: Data Centre database operation failed
components:
  securitySchemes:
    testagramNativeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
