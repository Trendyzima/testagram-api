openapi: 3.1.0
info:
  title: Testagram Data Centre Video Service
  version: "1.0.0"
  description: |
    Private Backend-to-Data-Centre video service contract. The Backend forwards
    the authenticated native Testagram user token; the Data Centre independently
    validates the user/session and enforces video ownership before deletion.
paths:
  /v1/videos:
    get:
      operationId: listOwnedVideos
      summary: List videos owned by the authenticated Testagram user
      description: Returns at most the newest 100 videos for the user identified by the validated native session. The caller cannot supply an owner ID; ownership is enforced by the Data Centre PostgreSQL query.
      security:
        - testagramNativeBearer: []
      responses:
        "200":
          description: Owner-scoped creator video list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, channel_id, channel_handle, channel_name, title, description, visibility, status, duration_ms, width, height, views, likes, comments, created_at, updated_at, published_at]
                      properties:
                        id: { type: string, format: uuid }
                        channel_id: { type: string, format: uuid }
                        channel_handle: { type: string }
                        channel_name: { type: string }
                        title: { type: string }
                        description: { type: string }
                        visibility: { type: string, enum: [private, public] }
                        status: { type: string }
                        duration_ms: { type: integer, minimum: 0 }
                        width: { type: integer, minimum: 0 }
                        height: { type: integer, minimum: 0 }
                        views: { type: integer, minimum: 0 }
                        likes: { type: integer, minimum: 0 }
                        comments: { type: integer, minimum: 0 }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                        published_at: { type: [string, "null"], format: date-time }
        "401":
          description: Native Testagram session is missing or invalid
        "500":
          description: Data Centre database operation failed
  /v1/videos/{video_id}:
    delete:
      operationId: deleteOwnedVideo
      summary: Delete an owned video and its associated records and media
      description: |
        Idempotent for an authenticated caller: an already absent video returns
        204. A video owned by another account is returned as not found. Deletion
        is refused while the video is uploading, queued, processing, or has an
        active video job. The video row, dependent engagement/job records and a
        durable media-cleanup outbox intent are committed atomically. The outbox
        row has no foreign key to the deleted video and survives that deletion.
        The private video worker claims cleanup with a lease, removes original,
        HLS and poster directories idempotently, and retries transient failures
        up to five attempts. A successful 204 confirms metadata deletion and
        durable cleanup scheduling; it does not promise synchronous filesystem
        removal. Terminal cleanup failures remain in the outbox for operator
        inspection and explicit requeue.
      security:
        - testagramNativeBearer: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Video metadata deleted (or already absent); media cleanup durably queued or already complete
        "401":
          description: Native Testagram session is missing or invalid
        "404":
          description: Video does not exist or is owned by another account
        "409":
          description: Upload or transcoding work is still active
        "500":
          description: Data Centre database operation failed
components:
  securitySchemes:
    testagramNativeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
