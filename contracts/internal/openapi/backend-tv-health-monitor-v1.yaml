openapi: 3.1.0
info:
  title: Testagram Backend Private TV Health Monitor
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Private machine-to-machine contract for the single authorized GitHub Actions
    TV health monitor. These endpoints are not public client APIs and must never
    be included in Flutter SDKs or public OpenAPI bundles. The Backend remains
    the authority for channel definitions and health persistence.
servers:
  - url: https://api.testagram.site
    description: Backend API origin; the internal paths require the dedicated GitHub OIDC identity.
security:
  - githubActionsOIDC: []
paths:
  /internal/tv/catalog:
    get:
      operationId: getAuthorizedTVMonitorCatalogue
      summary: Read the bounded TV channel catalogue for the authorized monitor
      description: >
        Accepts only a short-lived GitHub Actions OIDC token with issuer
        https://token.actions.githubusercontent.com, audience testagram-tv-health,
        repository Trendyzima/testagram-flutter-client-, workflow Testagram TV Health Monitor,
        workflow_ref ending in .github/workflows/tv-health-monitor.yml@refs/heads/main,
        ref refs/heads/main, and event schedule, workflow_dispatch or push.
        The response is private and must not be cached. A successful empty catalogue
        is represented by HTTP 200 with channels=[]; it is not a route or database error.
      security:
        - githubActionsOIDC: []
      responses:
        '200':
          description: Authorized catalogue read; an empty array is valid but means no health probes will run.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, channels, count]
                properties:
                  ok: { type: boolean, const: true }
                  count: { type: integer, minimum: 0, maximum: 20000 }
                  channels:
                    type: array
                    maxItems: 20000
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, url, source, country, group_name, priority]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
                        url: { type: string, format: uri, maxLength: 2048, pattern: '^https?://' }
                        source: { type: string, maxLength: 128 }
                        country: { type: string, maxLength: 128 }
                        group_name: { type: string, maxLength: 256 }
                        priority: { type: integer, minimum: 0, maximum: 100000 }
        '401': { description: 'Missing, invalid, expired or unauthorized GitHub Actions OIDC identity.' }
        '405': { description: Only GET is supported. }
        '503': { description: Backend database or catalogue query is unavailable. }
  /internal/tv/health:
    post:
      operationId: submitAuthorizedTVHealthBatch
      summary: Persist one bounded batch of TV stream health observations
      description: >
        Accepts the same GitHub Actions OIDC identity as the catalogue endpoint.
        Each batch contains 1 to 100 unique channel records. Backend persists the
        entire batch transactionally and returns only after commit. This endpoint
        is not available to Flutter, browsers or arbitrary service tokens.
      security:
        - githubActionsOIDC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channels]
              properties:
                channels:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [channel_id, url, is_online, latency_ms, check_error, source, country, group_name, priority]
                    properties:
                      channel_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
                      url: { type: string, format: uri, maxLength: 2048, pattern: '^https?://' }
                      is_online: { type: boolean }
                      latency_ms: { type: integer, minimum: 0, maximum: 30000 }
                      check_error: { type: string, maxLength: 500 }
                      source: { type: string, maxLength: 128 }
                      country: { type: string, maxLength: 128 }
                      group_name: { type: string, maxLength: 256 }
                      priority: { type: integer, minimum: 0, maximum: 100000 }
      responses:
        '200':
          description: All unique channel observations committed atomically.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, checked, persisted, checked_at]
                properties:
                  ok: { type: boolean, const: true }
                  checked: { type: integer, minimum: 1, maximum: 100 }
                  persisted: { type: integer, minimum: 1, maximum: 100 }
                  checked_at: { type: string, format: date-time }
        '400': { description: 'Invalid JSON, duplicate or invalid channel record, or batch outside the 1–100 bound.' }
        '401': { description: 'Missing, invalid, expired or unauthorized GitHub Actions OIDC identity.' }
        '405': { description: Only POST is supported. }
        '413': { description: Request body exceeds the 1 MiB limit. }
        '503': { description: Database unavailable or transaction could not be committed. }
components:
  securitySchemes:
    githubActionsOIDC:
      type: apiKey
      in: header
      name: X-GitHub-OIDC-Token
      description: >
        Short-lived GitHub Actions OIDC JWT. It is not a static API key and must
        be minted for audience testagram-tv-health. Only the named repository,
        workflow, main ref and approved event names are accepted.
