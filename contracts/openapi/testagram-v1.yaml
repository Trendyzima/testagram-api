openapi: 3.1.0
info:
  title: Testagram Public API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  summary: Source-audited public API contract with provisional DTOs.
  description: |
    Contract catalogue for the public Testagram Backend API. The Backend is
    the runtime and authorization authority. This repository owns the contract
    and client tooling only; it is not a replacement API server.

    Route existence and methods are audited against Backend source. DTOs remain
    provisional where handler behavior and tests have not yet been translated
    into strict schemas. Registered-only routes are tracked in the integration
    audit and are not safe for client adoption until promoted into this contract.
  contact:
    name: Testagram Engineering
    url: https://github.com/Trendyzima/testagram-api
servers:
  - url: https://api.testagram.site
    description: Intended production public API origin; verify DNS/runtime before release.
tags:
  - name: TV
    description: Proposed normalized catalogue and viewer-authorized playback contract.
  - name: Health
    description: Process liveness and dependency readiness.
  - name: Authentication
    description: Appwrite-backed account session and registration consent operations.
  - name: Feed
    description: Authorized home timeline retrieval.
  - name: Social
    description: Posts, reactions, replies and follow relationships.
  - name: Search
    description: Privacy-filtered people and post discovery.
  - name: Hashtags
    description: Privacy-filtered hashtag timelines and public trending topics.
  - name: Notifications
    description: Authenticated notification retrieval and read state.
  - name: Threads
    description: The separate long-form Threads product surface.
  - name: Federation
    description: Authenticated Testagram federation preferences. ActivityPub protocol traffic is handled by the private Federation service, not by clients.
  - name: Identity
    description: Applicant-facing native age-assurance application and private evidence submission. No account is provisioned until manual verification and independent two-person approval complete.
security:
  - appwriteBearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check Backend process liveness
      description: Process liveness only; it does not prove that dependencies are ready.
      security: []
      responses:
        '200':
          description: Backend process is alive.
          content:
            text/plain:
              schema: { type: string, example: "ok\n" }
  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check Backend readiness
      description: Readiness endpoint documented by the Backend repository.
      security: []
      responses:
        '200':
          description: Backend process and PostgreSQL are ready.
          content:
            text/plain:
              schema: { type: string, example: "ready\n" }
        '503':
          description: Backend database is unavailable.
          content:
            text/plain:
              schema: { type: string }
  /api/identity/applications:
    post:
      operationId: createIdentityApplication
      tags: [Identity]
      summary: Create a native age-assurance application
      description: Pre-authentication registration entry point. Registration is fail-closed unless Backend registration, policy versions, PostgreSQL, private evidence storage and verified replication are configured. Requires age, Terms and Privacy declarations plus a high-entropy idempotency key. This does not create an account.
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: '^[A-Za-z0-9_-]{43}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, username, display_name, adult_confirmed, terms_accepted, privacy_accepted]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-z0-9_]+$' }
                display_name: { type: string, minLength: 2, maxLength: 80 }
                adult_confirmed: { type: boolean, const: true }
                terms_accepted: { type: boolean, const: true }
                privacy_accepted: { type: boolean, const: true }
      responses:
        '202':
          description: Application and age-assurance session created; account provisioning has not occurred.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Request origin is not allowed. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/applications/{application_id}:
    get:
      operationId: getIdentityApplicationStatus
      tags: [Identity]
      summary: Retrieve applicant-scoped application status
      security: []
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Application-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Application status and age-assurance state; never implies approval unless explicitly returned by Backend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '404': { description: Application not found or applicant token invalid. }
  /api/identity/sessions/{session_id}:
    get:
      operationId: getIdentitySessionStatus
      tags: [Identity]
      summary: Retrieve applicant-scoped verification session status
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Verification session state and expiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '404': { description: Session not found or applicant token invalid. }
  /api/identity/sessions/{session_id}/evidence/upload-url:
    post:
      operationId: reserveIdentityEvidenceUpload
      tags: [Identity]
      summary: Reserve a private evidence upload
      description: Reserves one supported JPEG, PNG, WebP or PDF evidence object. Returns a relative Backend API upload path, not a presigned object-store URL; the applicant must PUT bytes to that path with the same verification-session token. Backend streams bytes to private storage and never exposes MinIO or provider URLs.
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_type, size_bytes, sha256]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                size_bytes: { type: integer, minimum: 1, maximum: 15728640 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '201':
          description: Private upload reservation created. upload_url is a relative Backend route, not an object-store URL.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [evidence_id, upload_url, method, content_type, size_bytes, expires_in_seconds]
                properties:
                  evidence_id: { type: string, format: uuid }
                  upload_url: { type: string, pattern: '^/api/identity/sessions/' }
                  method: { type: string, const: PUT }
                  content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                  size_bytes: { type: integer, minimum: 1, maximum: 15728640 }
                  expires_in_seconds: { type: integer, const: 300 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Session not found or no longer accepts evidence. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/sessions/{session_id}/evidence/{evidence_id}/upload:
    put:
      operationId: uploadIdentityEvidence
      tags: [Identity]
      summary: Upload reserved identity evidence through Backend
      description: Authenticated, bounded upload proxy. Backend verifies the reserved size, declared media type, SHA-256 digest and file signature before forwarding bytes to the private evidence bucket. Provider URLs and credentials are never returned to the applicant.
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: evidence_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
        - in: header
          name: Content-Type
          required: true
          schema: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Evidence bytes stored in private storage; no response body.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Request origin is not allowed. }
        '404': { description: Session or upload reservation not found. }
        '409': { description: 'Evidence size, content type, checksum or file signature does not match the reservation.' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '502': { description: Private object storage rejected or failed the upload. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/sessions/{session_id}/evidence/submit:
    post:
      operationId: submitIdentityEvidence
      tags: [Identity]
      summary: Verify and submit uploaded evidence for manual review
      description: Backend independently verifies upload size and SHA-256, confirms replication, seals evidence and moves the application into manual review. Submission is not an approval.
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evidence_id]
              properties:
                evidence_id: { type: string, format: uuid }
      responses:
        '202':
          description: Evidence accepted into manual review after integrity and replication checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Session or evidence reservation not found. }
        '409': { description: "Upload incomplete, checksum mismatch, or session is no longer submittable." }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/identity/review-queue:
    get:
      operationId: getIdentityReviewQueue
      tags: [Identity]
      summary: List applications awaiting manual identity review
      description: Requires a verified Appwrite staff account with the identity.review permission. Queue metadata contains opaque evidence references only; raw evidence is served by the separate no-store reviewer endpoint and every retrieval attempt is audited.
      security:
        - appwriteBearer: []
      responses:
        '200':
          description: Authorized manual-review queue.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verified staff identity.review permission is required. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/identity/sessions/{session_id}/evidence/{evidence_id}:
    get:
      operationId: getIdentityReviewEvidence
      tags: [Identity]
      summary: Stream private identity evidence to an authorized reviewer
      description: Requires verified Appwrite staff identity.review permission. Backend audits the access attempt before streaming, verifies byte length and SHA-256 before returning evidence, restores a missing or drifted VPS primary from a checksum-verified B2/R2 replica when possible, and otherwise serves only a checksum-verified private replica through the Backend proxy. No storage URL is returned; responses are private, no-store and nosniff.
      security:
        - appwriteBearer: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: evidence_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Private evidence bytes.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store, max-age=0' }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verified staff identity.review permission is required. }
        '404': { description: Evidence is not available for review. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/identity/sessions/{session_id}/decision:
    post:
      operationId: recordIdentityReviewDecision
      tags: [Identity]
      summary: Record one independent reviewer decision
      description: Requires verified Appwrite staff identity.review permission. A reviewer can decide once per session. Two distinct matching verified or failed decisions are required; a verified review creates a separate two-person account-approval request and does not itself provision an account.
      security:
        - appwriteBearer: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [verified, failed, escalate] }
                reason_code: { type: string, minLength: 2, maxLength: 64 }
      responses:
        '200': { description: Two matching failed reviews finalized rejection. }
        '202': { description: Review recorded; another independent review or escalation is pending. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Reviewer lacks permission or attempted self-review. }
        '409': { description: Session is not reviewable or reviewer already decided. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/identity/applications/{application_id}/approve:
    post:
      operationId: approveIdentityAccountProvisioning
      tags: [Identity]
      summary: Record one of the two independent account-activation approvals
      description: Requires verified Appwrite staff identity.review permission. Only the two reviewers who independently verified the evidence may approve; two distinct approvals are required before provisioning authorization can be issued.
      security:
        - appwriteBearer: []
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 8, maxLength: 1000 }
      responses:
        '200': { description: Two-person approval completed; provisioning can be authorized. }
        '202': { description: First independent approval recorded; second approval is pending. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Reviewer is not one of the independent evidence reviewers or attempted self-approval. }
        '409': { description: Application is not awaiting approval or this reviewer already decided. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/applications/{application_id}/provisioning-token:
    post:
      operationId: requestIdentityProvisioningAuthorization
      tags: [Identity]
      summary: Request a one-time provisioning authorization after approval
      description: Returns a short-lived single-use token only after the application has completed both independent approval stages.
      security: []
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Application-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Single-use approval token and JTI issued for 15 minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '404': { description: Application not found or applicant token invalid. }
        '409': { description: Application is not approved or authorization is unavailable. }
  /api/identity/applications/{application_id}/redeem:
    post:
      operationId: redeemIdentityProvisioningAuthorization
      tags: [Identity]
      summary: Redeem approved provisioning authorization against an Appwrite session
      description: Backend verifies the Appwrite session email matches the approved application, consumes the approval token and JTI once, and provisions the canonical account transactionally.
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Application-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
        - in: header
          name: X-Identity-Approval-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
        - in: header
          name: X-Identity-Approval-JTI
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Canonical account provisioned or an idempotent replay for the same Appwrite account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Appwrite email mismatch or invalid approval authorization. }
        '404': { description: Application or authorization not found. }
        '409': { description: "Approval authorization expired, consumed or replayed." }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/feed/home:
    get:
      operationId: getHomeFeed
      tags: [Feed]
      summary: Retrieve the authorized home timeline
      description: Supports the Following filter and opaque cursor pagination. Backend performs authorization and ranking orchestration. Private media URLs may include a parallel `media_auth_headers` map keyed by exact URL; clients must attach the matching Authorization header and must not cache these short-lived bearer assertions.
      parameters:
        - in: query
          name: following_only
          required: false
          schema: { type: boolean, default: false }
          description: Set true to restrict the feed to followed accounts.
        - in: query
          name: before
          required: false
          schema: { type: string }
          description: Opaque cursor returned by the previous feed page.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Authorized feed page. Exact payload schema is pending wire-level verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/hashtags/trending:
    get:
      operationId: getTrendingHashtags
      tags: [Hashtags]
      summary: Retrieve trending public hashtags
      description: Returns distinct public hashtags from the previous seven days. When authenticated, followed hashtags receive viewer-specific ranking affinity; the Backend retains public visibility filtering.
      security:
        - appwriteBearer: []
        - {}
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Trending hashtag list and ranking window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/hashtags/{tag}:
    get:
      operationId: getHashtagTimeline
      tags: [Hashtags]
      summary: Retrieve posts for a hashtag
      description: Returns a cursor-paginated timeline and the current viewer's private follow state. Backend applies account visibility, accepted-follow, block, mute and media authorization rules before returning records.
      security:
        - appwriteBearer: []
        - {}
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64, description: "Unicode letters, numbers or underscores; an optional leading # is accepted by the Backend." }
        - in: query
          name: before
          required: false
          schema: { type: string }
          description: Opaque cursor returned by the previous page.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Privacy-filtered hashtag timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/hashtags/{tag}/follow:
    get:
      operationId: getHashtagFollowState
      tags: [Hashtags]
      summary: Get the current viewer's hashtag follow state
      description: Authentication is optional. Anonymous viewers always receive is_following=false.
      security:
        - appwriteBearer: []
        - {}
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Private follow state for the authenticated viewer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: followHashtag
      tags: [Hashtags]
      summary: Follow a hashtag
      description: Creates a private interest signal used to personalize Explore. The follow is not public and is not federated.
      security:
        - appwriteBearer: []
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Hashtag follow is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: unfollowHashtag
      tags: [Hashtags]
      summary: Unfollow a hashtag
      description: Removes the current viewer's private Explore interest signal.
      security:
        - appwriteBearer: []
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Hashtag follow is inactive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/upload-intent:
    post:
      operationId: createMediaUploadIntent
      tags: [Media]
      summary: Reserve a bounded public-media upload
      description: Backend authenticates the owner, enforces content type, visibility and byte limits, and returns a short-lived upload URL and opaque object key.
      security:
        - appwriteBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, content_type, visibility, size_bytes]
              properties:
                name: {type: string, maxLength: 255}
                content_type: {type: string, enum: [image/jpeg, image/png, image/webp, image/gif, image/avif]}
                visibility: {type: string, enum: [public]}
                size_bytes: {type: integer, minimum: 1, maximum: 20971520}
      responses:
        '201':
          description: Reserved upload intent with object key and short-lived PUT URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/upload:
    put:
      operationId: uploadMediaBytes
      tags: [Media]
      summary: Stream bytes into a reserved upload intent
      description: The client must use the URL returned by the upload-intent response, preserve its key query parameter, send the matching Content-Type, and stay within the reserved byte limit.
      security:
        - appwriteBearer: []
      parameters:
        - in: query
          name: key
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Upload bytes accepted and intent moved to uploaded state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: "Upload intent is missing, expired or belongs to another account"}
        '409': {description: Upload intent was already consumed}
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': {description: Content type does not match the upload intent}
  /api/media/cdn-download-url:
    post:
      operationId: issuePrivateMediaCDNAuthorization
      tags: [Media]
      summary: Issue viewer-bound authorization for one private media object
      description: Backend authenticates the viewer, verifies ownership and ready/private state in the canonical media ledger, and issues a short-lived exact-object CDN assertion. The returned URL is not a bearer credential; send the returned Authorization value to the CDN. HLS multi-object playback is not covered by this exact-object grant.
      security:
        - appwriteBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '200':
          description: Viewer-bound CDN URL and short-lived Authorization header value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: Viewer is not authorized to access this media object}
        '404': {description: No ready private media object owned by this viewer exists}
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/complete:
    post:
      operationId: completeMediaUpload
      tags: [Media]
      summary: Verify uploaded media and persist its metadata
      security:
        - appwriteBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, visibility, content_type, checksum_sha256]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
                visibility: {type: string, enum: [public]}
                content_type: {type: string}
                checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200':
          description: Verified media asset is ready for attachment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: Upload intent does not belong to the authenticated account}
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/attach:
    post:
      operationId: attachMediaToPost
      tags: [Media]
      summary: Attach a verified public media asset to an owned post
      description: Only ready, owner-matched public assets can be attached. The Backend checks post ownership and visibility transactionally; attachment is idempotent.
      security:
        - appwriteBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, post_id]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
                post_id: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Media is attached to the post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: Media asset or post is not owned by the authenticated account}
        '404': {description: Media asset or post was not found}
        '409': {description: Media is not ready or the post is not eligible}
  /api/media/delete:
    post:
      operationId: deleteMediaAsset
      tags: [Media]
      summary: Delete an unattached media asset
      description: Starts durable deletion for an asset owned by the authenticated account. Used to clean up un-attached uploads after a failed publish.
      security:
        - appwriteBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '200':
          description: Deletion accepted or already completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': {description: Media asset was not found}
        '409': {description: Media asset cannot be deleted in its current state}
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/search:
    get:
      operationId: searchContent
      tags: [Search]
      summary: Search people and posts
      description: Privacy-filtered product search. Authentication is optional for public results; Backend applies visibility and authorization rules.
      security:
        - appwriteBearer: []
        - {}
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: kind
          required: false
          schema: { type: string, enum: [all, people, posts], default: all }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: media_only
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Search result page; exact payload shape must be confirmed from Backend tests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/social/posts:
    post:
      operationId: createSocialPost
      tags: [Social]
      summary: Create a main-feed post
      description: Backend source registers this route. The operation is idempotent per author and key; reusing a key with a different normalized payload returns 409. Backend rejects unknown JSON fields and limits the request body to 16 KiB. This is not the Threads composer.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, visibility]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
                visibility: { type: string, enum: [public, followers, private] }
      responses:
        '200':
          description: Existing post returned for a retry with the same author, key and normalized payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostCreateReplayEnvelope' }
        '201':
          description: New post committed successfully.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostCreateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency key was already used with a different normalized payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Content moderation requires review; no post is published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationReviewEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/posts/{postId}/interaction-summary:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPostInteractionSummary
      tags: [Social]
      summary: Get viewer-specific post interaction state
      description: Returns interaction state and counters for the authenticated viewer.
      responses:
        '200':
          description: Interaction summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/social/posts/{postId}/reaction:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      operationId: createPostReaction
      tags: [Social]
      summary: Create or update a post reaction
      description: Reaction lifecycle route documented by the Flutter integration ledger. Verify accepted reaction values and request body against Backend implementation.
      requestBody:
        required: true
