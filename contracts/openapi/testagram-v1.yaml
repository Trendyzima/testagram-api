openapi: 3.1.0
info:
  title: Testagram Public API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  summary: Source-audited public API contract with provisional DTOs.
  description: |
    Contract catalogue for the public Testagram Backend API. The Backend is
    the runtime and authorization authority. This repository owns the contract
    and client tooling only; it is not a replacement API server.

    Route existence and methods are audited against Backend source. DTOs remain
    provisional where handler behavior and tests have not yet been translated
    into strict schemas. Registered-only routes are tracked in the integration
    audit and are not safe for client adoption until promoted into this contract.
  contact:
    name: Testagram Engineering
    url: https://github.com/Trendyzima/testagram-api
servers:
  - url: https://api.testagram.site
    description: Intended production public API origin; verify DNS/runtime before release.
tags:
  - name: TV
    description: Proposed normalized catalogue and viewer-authorized playback contract.
  - name: Health
    description: Process liveness and dependency readiness.
  - name: Authentication
    description: End-user and identity-review operations accept only Testagram-native short-lived access JWTs. Backend checks the live PostgreSQL session, account state, enabled staff principal, enrolled-MFA marker and explicit role grants. No external identity-provider bearer token is accepted.
  - name: Feed
    description: Authorized home timeline retrieval.
  - name: Social
    description: Posts, reactions, replies and follow relationships.
  - name: Search
    description: Privacy-filtered people and post discovery.
  - name: Hashtags
    description: Privacy-filtered hashtag timelines and public trending topics.
  - name: Knowledge
    description: Authenticated, privacy-filtered questions, answers and curated topic discovery.
  - name: Notifications
    description: Authenticated notification retrieval and read state.
  - name: Threads
    description: The separate long-form Threads product surface.
  - name: Federation
    description: Authenticated Testagram federation preferences. ActivityPub protocol traffic is handled by the private Federation service, not by clients.
  - name: Identity
    description: Applicant-facing native age-assurance application and private evidence submission. No account is provisioned until manual verification and independent two-person approval complete.
security:
  - testagramBearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check Backend process liveness
      description: Process liveness only; it does not prove that dependencies are ready.
      security: []
      responses:
        '200':
          description: Backend process is alive.
          content:
            text/plain:
              schema: { type: string, example: "ok\n" }
        '405': { description: Method not allowed; GET is required. }
  /api/auth/signup:
    post:
      operationId: requestPublicSignup
      tags: [Authentication]
      summary: Request public account creation (identity review required)
      description: Public self-service signup is intentionally fail-closed. This endpoint never creates an account. Testagram accounts are provisioned only through the approved identity application flow after verified evidence review and two independent account approvals. Email verification remains required after approved provisioning.
      security: []
      responses:
        '403':
          description: Identity evidence review and two-person account approval are required before account creation. ORIGIN_NOT_ALLOWED may also be returned when the request origin is not permitted.
        '405': { description: Method not allowed; POST is required. }
  /api/auth/login:
    post:
      operationId: loginWithTestagramCredentials
      tags: [Authentication]
      summary: Create a native Testagram session
      description: Verifies the canonical Testagram password, email-verification state, account status and identity-provisioning state. Returns a 15-minute access token and an opaque rotating refresh token. The refresh token must be stored only in platform secure storage.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Native session created.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeAuthResponse' }
        '401': { description: Credentials are invalid. }
        '403': { description: "Email verification, account approval or password reset is required." }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/auth/refresh:
    post:
      operationId: rotateTestagramRefreshToken
      tags: [Authentication]
      summary: Rotate a native refresh token
      description: Atomically consumes the presented refresh token and issues a new refresh token and short-lived access token. Reuse of a revoked token revokes its entire token family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 40, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Rotated native session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeAuthResponse' }
        '401': { description: "Refresh token is invalid, expired, revoked or reused." }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/auth/forgot-password:
    post:
      operationId: requestTestagramPasswordRecovery
      tags: [Authentication]
      summary: Request password recovery
      description: Always returns a generic anti-enumeration response. If an eligible verified account exists, Backend stores only a hash of a single-use 30-minute recovery token and sends the link using configured Testagram email delivery.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Generic recovery acknowledgement; does not disclose whether an account exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericAuthMessage' }
        '400': { description: Malformed request or invalid email address. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/auth/reset-password:
    post:
      operationId: resetTestagramPassword
      tags: [Authentication]
      summary: Complete password recovery
      description: Consumes a single-use, unexpired recovery token, updates the password, increments the account token version and revokes all existing sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 128, writeOnly: true }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Password reset and existing sessions revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericAuthMessage' }
        '400': { description: "Recovery token is invalid or expired, or password policy is not satisfied." }
        '403': { description: Account is not eligible for password reset. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/auth/logout:
    post:
      operationId: revokeTestagramSession
      tags: [Authentication]
      summary: Revoke the current native session
      security:
        - testagramBearer: []
      responses:
        '200': { description: Current session revoked. }
        '401': { description: Native access token is invalid or expired. }
  /api/auth/logout-all:
    post:
      operationId: revokeAllTestagramSessions
      tags: [Authentication]
      summary: Revoke every active session for the current account
      description: Increments the account token version and revokes all active sessions.
      security:
        - testagramBearer: []
      responses:
        '200': { description: All active sessions revoked. }
        '401': { description: Native access token is invalid or expired. }
  /api/identity/applications:
    post:
      operationId: createIdentityApplication
      tags: [Identity]
      summary: Create a native age-assurance application
      description: Pre-authentication registration entry point. Registration is fail-closed unless Backend registration, policy versions, PostgreSQL, private evidence storage and verified replication are configured. Requires age, Terms and Privacy declarations plus a high-entropy idempotency key. This does not create an account.
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: '^[A-Za-z0-9_-]{43}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, username, display_name, adult_confirmed, terms_accepted, privacy_accepted]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-z0-9_]+$' }
                display_name: { type: string, minLength: 2, maxLength: 80 }
                adult_confirmed: { type: boolean, const: true }
                terms_accepted: { type: boolean, const: true }
                privacy_accepted: { type: boolean, const: true }
      responses:
        '202':
          description: >
            New application, idempotently resumed application, or anti-enumeration
            acceptance. A resumed application can omit its evidence-session capability;
            account provisioning is never performed by this endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityApplicationCreateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Request origin is not allowed. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/applications/{application_id}:
    get:
      operationId: getIdentityApplicationStatus
      tags: [Identity]
      summary: Retrieve applicant-scoped application status
      security: []
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Application-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Application status and age-assurance state; never implies approval unless explicitly returned by Backend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityApplicationStatus' }
        '404': { description: Application not found or applicant token invalid. }
  /api/identity/sessions/{session_id}:
    get:
      operationId: getIdentitySessionStatus
      tags: [Identity]
      summary: Retrieve applicant-scoped verification session status
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Verification session state and expiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityVerificationSessionStatus' }
        '404': { description: Session not found or applicant token invalid. }
  /api/identity/sessions/{session_id}/evidence/upload-url:
    post:
      operationId: reserveIdentityEvidenceUpload
      tags: [Identity]
      summary: Reserve a private evidence upload
      description: Reserves one supported JPEG, PNG, WebP or PDF evidence object. Returns a relative Backend API upload path, not a presigned object-store URL; the applicant must PUT bytes to that path with the same verification-session token. Backend streams bytes to private storage and never exposes MinIO or provider URLs.
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_type, size_bytes, sha256]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                size_bytes: { type: integer, minimum: 1, maximum: 15728640 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '201':
          description: Private upload reservation created. upload_url is a relative Backend route, not an object-store URL.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [evidence_id, upload_url, method, content_type, size_bytes, expires_in_seconds]
                properties:
                  evidence_id: { type: string, format: uuid }
                  upload_url: { type: string, pattern: '^/api/identity/sessions/' }
                  method: { type: string, const: PUT }
                  content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                  size_bytes: { type: integer, minimum: 1, maximum: 15728640 }
                  expires_in_seconds: { type: integer, const: 300 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Session not found or no longer accepts evidence. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/sessions/{session_id}/evidence/{evidence_id}/upload:
    put:
      operationId: uploadIdentityEvidence
      tags: [Identity]
      summary: Upload reserved identity evidence through Backend
      description: Authenticated, bounded upload proxy. Backend verifies the reserved size, declared media type, SHA-256 digest and file signature before forwarding bytes to the private evidence bucket. Provider URLs and credentials are never returned to the applicant.
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: evidence_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
        - in: header
          name: Content-Type
          required: true
          schema: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Evidence bytes stored in private storage; no response body.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Request origin is not allowed. }
        '404': { description: Session or upload reservation not found. }
        '409': { description: 'Evidence size, content type, checksum or file signature does not match the reservation.' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '502': { description: Private object storage rejected or failed the upload. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/sessions/{session_id}/evidence/submit:
    post:
      operationId: submitIdentityEvidence
      tags: [Identity]
      summary: Verify and submit uploaded evidence for manual review
      description: Backend independently verifies upload size and SHA-256, confirms replication, seals evidence and moves the application into manual review. Submission is not an approval.
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Verification-Session-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evidence_id]
              properties:
                evidence_id: { type: string, format: uuid }
      responses:
        '202':
          description: Evidence accepted into manual review after integrity and replication checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Session or evidence reservation not found. }
        '409': { description: "Upload incomplete, checksum mismatch, or session is no longer submittable." }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/identity/review-queue:
    get:
      operationId: getIdentityReviewQueue
      tags: [Identity]
      summary: List applications awaiting manual identity review
      description: Requires a Testagram-native staff access JWT with a backend-signed `mfa_at` timestamp no older than five minutes, a live enabled staff principal, an enrolled WebAuthn credential and identity.review permission. The Backend now supports WebAuthn challenge verification and MFA elevation; production access remains fail-closed until the staff WebAuthn migration, exact RP ID/origin configuration, runtime readiness, controlled enrollment and live assertion acceptance are verified. Queue metadata contains opaque evidence references only; raw evidence is served by the separate no-store reviewer endpoint and every retrieval attempt is audited.
      security:
        - testagramBearer: []
      responses:
        '200':
          description: Authorized manual-review queue.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verified staff identity.review permission is required. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/identity/sessions/{session_id}/evidence/{evidence_id}:
    get:
      operationId: getIdentityReviewEvidence
      tags: [Identity]
      summary: Stream private identity evidence to an authorized reviewer
      description: Requires a Testagram-native staff access JWT with a backend-signed `mfa_at` timestamp no older than five minutes, a live enabled staff principal, an enrolled WebAuthn credential and identity.review permission. Production access remains fail-closed until migration, RP ID/origin configuration, runtime readiness, controlled enrollment and live assertion acceptance pass. Backend audits the access attempt before streaming, verifies byte length and SHA-256 before returning evidence, restores a missing or drifted VPS primary from a checksum-verified B2/R2 replica when possible, and otherwise serves only a checksum-verified private replica through the Backend proxy. No storage URL is returned; responses are private, no-store and nosniff.
      security:
        - testagramBearer: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: evidence_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Private evidence bytes.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store, max-age=0' }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verified staff identity.review permission is required. }
        '404': { description: Evidence is not available for review. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/identity/sessions/{session_id}/decision:
    post:
      operationId: recordIdentityReviewDecision
      tags: [Identity]
      summary: Record one independent reviewer decision
      description: Requires a Testagram-native staff access JWT with a backend-signed `mfa_at` timestamp no older than five minutes, a live enabled PostgreSQL staff principal, an enrolled WebAuthn credential and identity.review permission. Production access remains fail-closed until migration, RP ID/origin configuration, runtime readiness, controlled enrollment and live assertion acceptance pass. A reviewer can decide once per session. Two distinct matching verified or failed decisions are required; a verified review creates a separate two-person account-approval request and does not itself provision an account.
      security:
        - testagramBearer: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [verified, failed, escalate] }
                reason_code: { type: string, minLength: 2, maxLength: 64 }
      responses:
        '200': { description: Two matching failed reviews finalized rejection. }
        '202': { description: Review recorded; another independent review or escalation is pending. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Reviewer lacks permission or attempted self-review. }
        '409': { description: Session is not reviewable or reviewer already decided. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/applications/{application_id}/provisioning-token:
    post:
      operationId: requestIdentityProvisioningAuthorization
      tags: [Identity]
      summary: Request a one-time provisioning authorization after approval
      description: Returns a short-lived single-use token only after the application has completed both independent approval stages.
      security: []
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Application-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Single-use approval token and JTI issued for 15 minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '404': { description: Application not found or applicant token invalid. }
        '409': { description: Application is not approved or authorization is unavailable. }
  /api/identity/applications/{application_id}/redeem:
    post:
      operationId: redeemIdentityProvisioningAuthorization
      tags: [Identity]
      summary: Redeem approved provisioning authorization to provision a native Testagram account
      description: Backend revalidates the application capability, both independent identity-review decisions and the two-person sensitive-action approval ledger inside one PostgreSQL transaction. It consumes the approval token and JTI once, creates the Testagram-native credential and canonical profile atomically, and starts a separate single-use email-verification step. No external identity-provider session is required.
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Application-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
        - in: header
          name: X-Identity-Approval-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
        - in: header
          name: X-Identity-Approval-JTI
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Native Testagram account and canonical profile provisioned, or an idempotent replay for the same approved application and native user. Email verification remains required before sign-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid application capability or provisioning approval authorization. }
        '404': { description: Application or authorization not found. }
        '409': { description: "Approval authorization expired, consumed or replayed." }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/applications/{application_id}/resend-verification:
    post:
      operationId: resendNativeIdentityVerification
      tags: [Identity]
      summary: Request another native account verification email
      description: Uses the applicant-scoped X-Application-Token and returns the same generic response whether the application is awaiting verification or the capability is invalid. Resend is rate-limited and does not create or activate an account.
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Application-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '202':
          description: Generic anti-enumeration acknowledgement. Delivery may be pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/identity/applications/{application_id}/verify-email:
    post:
      operationId: verifyNativeIdentityEmail
      tags: [Identity]
      summary: Verify the email address for a provisioned native account
      description: Consumes the single-use email token after approved provisioning. On success the native provisioning state becomes active; the account can then sign in. Invalid or expired tokens do not activate an account.
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Email verified and native account activated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, email_verified, canonical_user_id]
                properties:
                  status: { type: string, const: active }
                  email_verified: { type: boolean, const: true }
                  canonical_user_id: { type: string, format: uuid }
        '400': { description: Verification token is invalid or expired. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/feed/public:
    get:
      operationId: getPublicFeed
      tags: [Feed]
      summary: Retrieve the public native-post timeline
      description: Public posts from active, non-protected local accounts. No bearer token is required. Cursor is scoped to this native public-post feed; ranking falls back to chronological order if Algorithm is unavailable.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: before
          required: false
          schema: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Public native-post page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFeedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/feed/home:
    get:
      operationId: getHomeFeed
      tags: [Feed]
      summary: Retrieve the authorized home timeline
      description: >-
        Returns a normalized timeline of Testagram-native and eligible public remote posts. Backend is the
        sole authorization boundary and applies visibility, block, mute, moderation, deletion and source-policy
        checks before candidates reach the private Algorithm service. Algorithm may only reorder supplied IDs.
        Remote ActivityPub and AT Protocol items are read-only unless an explicit interaction capability is true.
        Cursors are opaque and bound to the viewer and selected lane. Media URLs must be Testagram CDN URLs;
        clients must never fetch arbitrary upstream media URLs.
      parameters:
        - in: query
          name: feed
          required: false
          schema: { type: string, enum: [for_you, following, latest, media, discover, federated], default: for_you }
          description: Select a server-defined feed generator lane; clients cannot supply ranking weights or candidate IDs.
        - in: query
          name: following_only
          required: false
          schema: { type: boolean, default: false }
          description: Set true to restrict the feed to followed accounts.
        - in: query
          name: video_only
          required: false
          schema: { type: boolean, default: false }
          description: Set true to return only posts with at least one ready, public video attachment. Backend applies post visibility, block, mute, ownership and media-readiness checks before returning a playback URL.
        - in: query
          name: list_id
          required: false
          schema: { type: string, format: uuid }
          description: Restrict candidates to members of an existing Testagram List. The List must be owned by the viewer or have public/unlisted visibility. List membership never grants access to protected or private posts; normal account visibility, accepted-follow, block, mute, moderation and deletion checks still apply. Pagination cursors are scoped to the selected List and cannot be reused on another feed.
        - in: query
          name: sources
          required: false
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: { type: string, enum: [native, activitypub, atproto] }
          description: Optional source allowlist; Backend still enforces visibility and source policy.
        - in: query
          name: before
          required: false
          schema: { type: string }
          description: Opaque cursor returned by the previous feed page.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Authorized, normalized mixed-source feed page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnifiedFeedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/me/email-notifications:
    get:
      operationId: getMyEmailNotificationPreferences
      tags: [Notifications]
      summary: Read the authenticated user's social email preferences
      description: Returns explicit consent settings for new-follower and new-post activity emails. Missing preference records default to disabled. Requires the Testagram-native access JWT.
      security:
        - testagramBearer: []
      responses:
        '200':
          description: Current social email preferences and consent prompt state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data, error, request_id]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [new_follower_email_enabled, new_post_email_enabled, consent_version, consent_prompt_required]
                    properties:
                      new_follower_email_enabled: { type: boolean }
                      new_post_email_enabled: { type: boolean }
                      consent_version: { type: string }
                      consent_prompt_required: { type: boolean }
                  error: { type: 'null' }
                  request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: updateMyEmailNotificationPreferences
      tags: [Notifications]
      summary: Update the authenticated user's social email consent
      description: Updates one or both independent social email preferences. Disabling a category cancels queued, not-yet-sent messages for that category. Both preferences default to disabled until the user opts in.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                new_follower_email_enabled: { type: boolean }
                new_post_email_enabled: { type: boolean }
      responses:
        '200':
          description: Updated preferences and current consent prompt state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/me/notification-preferences:
    get:
      operationId: getMyNotificationPreferences
      tags: [Notifications]
      summary: Read the authenticated user's push notification preferences
      description: Returns category consent for social, wallet and messaging notifications. Missing preference records default to enabled. Requires the Testagram-native access JWT.
      security:
        - testagramBearer: []
      responses:
        '200':
          description: Current push notification preferences.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data, error, request_id]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [push_social_enabled, push_wallet_enabled, push_messages_enabled]
                    properties:
                      push_social_enabled: { type: boolean }
                      push_wallet_enabled: { type: boolean }
                      push_messages_enabled: { type: boolean }
                  error: { type: 'null' }
                  request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: updateMyNotificationPreferences
      tags: [Notifications]
      summary: Update the authenticated user's push notification preferences
      description: Updates one or more independent push categories. Omitted categories retain their existing values. Requires the Testagram-native access JWT.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                push_social_enabled: { type: boolean }
                push_wallet_enabled: { type: boolean }
                push_messages_enabled: { type: boolean }
      responses:
        '200':
          description: Updated preferences in the standard Backend response envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data, error, request_id]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [push_social_enabled, push_wallet_enabled, push_messages_enabled]
                    properties:
                      push_social_enabled: { type: boolean }
                      push_wallet_enabled: { type: boolean }
                      push_messages_enabled: { type: boolean }
                  error: { type: 'null' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/email/unsubscribe:
    get:
      operationId: previewSocialEmailUnsubscribe
      tags: [Notifications]
      summary: Preview a one-click social email unsubscribe
      description: Displays a confirmation page for the category-bound token. GET never changes preferences; the recipient must submit the confirmation form.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, minLength: 40, maxLength: 128 }
      responses:
        '200':
          description: HTML confirmation page.
          content:
            text/html:
              schema: { type: string }
        '404': { description: Invalid or expired unsubscribe token. }
    post:
      operationId: confirmSocialEmailUnsubscribe
      tags: [Notifications]
      summary: Confirm a one-click social email unsubscribe
      description: Disables only the category bound to the opaque token, cancels pending messages in that category and records token use. Repeated submissions are idempotent. No login is required.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, minLength: 40, maxLength: 128 }
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string, minLength: 40, maxLength: 128 }
      responses:
        '200':
          description: Unsubscribe confirmation page.
          content:
            text/html:
              schema: { type: string }
        '400': { description: Invalid unsubscribe request. }
        '404': { description: Invalid or expired unsubscribe token. }
        '503': { description: Unsubscribe is temporarily unavailable. }
  /api/trends/words:
    get:
      operationId: getTrendingWords
      tags: [Discovery]
      summary: Retrieve rising public discussion words
      description: Returns normalized public discussion words from the previous seven days. The Backend excludes private, protected, deleted and inactive-account content, removes common stop words, and supplies recent-versus-prior-24-hour acceleration to the Algorithm ranker. Authentication is optional; viewer-specific affinity is applied only when available.
      security:
        - testagramBearer: []
        - {}
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Trending words, counts, momentum and ranking metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/hashtags/trending:
    get:
      operationId: getTrendingHashtags
      tags: [Hashtags]
      summary: Retrieve trending public hashtags
      description: Returns distinct public hashtags from the previous seven days, ranked using recency, public volume, viewer affinity and short-term acceleration. The Backend retains public visibility filtering.
      security:
        - testagramBearer: []
        - {}
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Trending hashtag list and ranking window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/hashtags/{tag}:
    get:
      operationId: getHashtagTimeline
      tags: [Hashtags]
      summary: Retrieve posts for a hashtag
      description: Returns a cursor-paginated timeline and the current viewer's private follow state. Backend applies account visibility, accepted-follow, block, mute and media authorization rules before returning records.
      security:
        - testagramBearer: []
        - {}
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64, description: "Unicode letters, numbers or underscores; an optional leading # is accepted by the Backend." }
        - in: query
          name: before
          required: false
          schema: { type: string }
          description: Opaque cursor returned by the previous page.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Privacy-filtered hashtag timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/hashtags/{tag}/follow:
    get:
      operationId: getHashtagFollowState
      tags: [Hashtags]
      summary: Get the current viewer's hashtag follow state
      description: Authentication is optional. Anonymous viewers always receive is_following=false.
      security:
        - testagramBearer: []
        - {}
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Private follow state for the authenticated viewer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: followHashtag
      tags: [Hashtags]
      summary: Follow a hashtag
      description: Creates a private interest signal used to personalize Explore. The follow is not public and is not federated.
      security:
        - testagramBearer: []
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Hashtag follow is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: unfollowHashtag
      tags: [Hashtags]
      summary: Unfollow a hashtag
      description: Removes the current viewer's private Explore interest signal.
      security:
        - testagramBearer: []
      parameters:
        - in: path
          name: tag
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Hashtag follow is inactive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/list:
    post:
      operationId: listOwnedMedia
      tags: [Media]
      summary: List ready media owned by the authenticated account
      description: Returns at most 100 ready owned assets. Private items receive short-lived owner-scoped URLs; provider credentials and raw private object URLs are never exposed.
      security:
        - testagramBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200':
          description: Ready assets owned by the authenticated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedMediaListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/private-download-url:
    post:
      operationId: createPrivateMediaDownloadURL
      tags: [Media]
      summary: Issue a short-lived URL for one owned private media object
      description: Backend verifies the object is ready, private and owned by the authenticated account. The URL expires after 300 seconds.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivateMediaDownloadRequest' }
      responses:
        '200':
          description: Short-lived owner-scoped private media URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateMediaDownloadEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/upload-intent:
    post:
      operationId: createMediaUploadIntent
      tags: [Media]
      summary: Reserve a bounded public-media upload
      description: Backend authenticates the owner, enforces content type, visibility and byte limits, and returns a short-lived upload URL and opaque object key.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, content_type, visibility, size_bytes]
              properties:
                name: {type: string, maxLength: 255}
                content_type: {type: string, enum: [image/jpeg, image/png, image/webp, image/gif, image/avif]}
                visibility: {type: string, enum: [public]}
                size_bytes: {type: integer, minimum: 1, maximum: 20971520}
      responses:
        '201':
          description: Reserved upload intent with object key and short-lived PUT URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/upload:
    put:
      operationId: uploadMediaBytes
      tags: [Media]
      summary: Stream bytes into a reserved upload intent
      description: The client must use the URL returned by the upload-intent response, preserve its key query parameter, send the matching Content-Type, and stay within the reserved byte limit.
      security:
        - testagramBearer: []
      parameters:
        - in: query
          name: key
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Upload bytes accepted and intent moved to uploaded state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: "Upload intent is missing, expired or belongs to another account"}
        '409': {description: Upload intent was already consumed}
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': {description: Content type does not match the upload intent}
  /api/media/cdn-download-url:
    post:
      operationId: issuePrivateMediaCDNAuthorization
      tags: [Media]
      summary: Issue viewer-bound authorization for one private media object
      description: Backend authenticates the viewer, verifies ownership and ready/private state in the canonical media ledger, and issues a short-lived exact-object CDN assertion. The returned URL is not a bearer credential; send the returned Authorization value to the CDN. HLS multi-object playback is not covered by this exact-object grant.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '200':
          description: Viewer-bound CDN URL and short-lived Authorization header value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: Viewer is not authorized to access this media object}
        '404': {description: No ready private media object owned by this viewer exists}
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/complete:
    post:
      operationId: completeMediaUpload
      tags: [Media]
      summary: Verify uploaded media and persist its metadata
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, visibility, content_type, checksum_sha256]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
                visibility: {type: string, enum: [public]}
                content_type: {type: string}
                checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200':
          description: Verified media asset is ready for attachment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: Upload intent does not belong to the authenticated account}
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/media/attach:
    post:
      operationId: attachMediaToPost
      tags: [Media]
      summary: Attach a verified public media asset to an owned post
      description: Only ready, owner-matched public assets can be attached. The Backend checks post ownership and visibility transactionally; attachment is idempotent.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, post_id]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
                post_id: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Media is attached to the post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': {description: Media asset or post is not owned by the authenticated account}
        '404': {description: Media asset or post was not found}
        '409': {description: Media is not ready or the post is not eligible}
  /api/media/delete:
    post:
      operationId: deleteMediaAsset
      tags: [Media]
      summary: Delete an unattached media asset
      description: Starts durable deletion for an asset owned by the authenticated account. Used to clean up un-attached uploads after a failed publish.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '200':
          description: Deletion accepted or already completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': {description: Media asset was not found}
        '409': {description: Media asset cannot be deleted in its current state}
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/search:
    get:
      operationId: searchContent
      tags: [Search]
      summary: Search people and posts
      description: Privacy-filtered product search. Authentication is optional for public results; Backend applies visibility and authorization rules. Advanced filters apply to post results; people discovery remains governed by account discoverability.
      security:
        - testagramBearer: []
        - {}
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: kind
          required: false
          schema: { type: string, enum: [all, people, posts], default: all }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: media_only
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: from
          required: false
          schema: { type: string, minLength: 2, maxLength: 30, pattern: '^[A-Za-z0-9_.]+$' }
          description: Restrict post results to an exact username. A leading @ is accepted by the Flutter client and removed before sending.
        - in: query
          name: since
          required: false
          schema: { type: string }
          description: Inclusive lower creation-time bound. Accepts RFC3339 timestamps or YYYY-MM-DD as UTC midnight.
        - in: query
          name: until
          required: false
          schema: { type: string }
          description: Exclusive upper creation-time bound. Accepts RFC3339 timestamps or YYYY-MM-DD, interpreted as the following UTC midnight.
        - in: query
          name: language
          required: false
          schema: { type: string, maxLength: 35, pattern: '^[A-Za-z0-9-]+$' }
          description: Exact language tag filter, case-insensitive.
        - in: query
          name: sort
          required: false
          schema: { type: string, enum: [latest, popular], default: latest }
          description: Newest-first or engagement-weighted order; SQL ordering is selected from a fixed server enum.
        - in: query
          name: video_only
          required: false
          schema: { type: boolean, default: false }
          description: Require a ready, public video asset owned by the post author. This never bypasses post visibility or media authorization.
      responses:
        '200':
          description: Search result page; exact payload shape must be confirmed from Backend tests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/history:
    get:
      operationId: getBrowsingHistory
      tags: [Social]
      summary: Read the authenticated account's browsing history
      description: Returns up to 100 post, thread and video history entries for the authenticated account only.
      security:
        - testagramBearer: []
      responses:
        '200':
          description: History ordered by most recent view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowsingHistoryListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: recordBrowsingHistory
      tags: [Social]
      summary: Record a viewed post, thread or video
      description: Upserts one history entry for the authenticated account; repeated views refresh viewed_at and metadata.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowsingHistoryRecordRequest' }
      responses:
        '200':
          description: History entry recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowsingHistoryRecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: clearBrowsingHistory
      tags: [Social]
      summary: Clear the authenticated account's browsing history
      security:
        - testagramBearer: []
      responses:
        '200':
          description: Number of history entries deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowsingHistoryClearEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/posts:
    post:
      operationId: createSocialPost
      tags: [Social]
      summary: Create a main-feed post
      description: Backend source registers this route. The operation is idempotent per author and key; reusing a key with a different normalized payload returns 409. Backend rejects unknown JSON fields and limits the request body to 16 KiB. This is not the Threads composer.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, visibility]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
                visibility: { type: string, enum: [public, followers, private] }
      responses:
        '200':
          description: Existing post returned for a retry with the same author, key and normalized payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostCreateReplayEnvelope' }
        '201':
          description: New post committed successfully.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostCreateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency key was already used with a different normalized payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Content moderation requires review; no post is published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationReviewEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/posts/{postId}/poll:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPostPoll
      tags: [Social]
      summary: Read the poll attached to a post
      description: Bearer authentication is optional; when supplied, has_voted reflects the authenticated viewer. Without a token only a public post's poll is readable.
      responses:
        '200':
          description: Poll attached to the post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/posts/{postId}/interaction-summary:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPostInteractionSummary
      tags: [Social]
      summary: Get viewer-specific post interaction state
      description: Returns interaction state and counters for the authenticated viewer.
      responses:
        '200':
          description: Interaction summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/social/posts/{postId}/reaction:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPostReactionState
      tags: [Social]
      summary: Read the authenticated viewer's post reaction
      description: Returns whether the viewer reacted, the stored emoji (empty when absent), and the current likes count.
      security:
        - testagramBearer: []
      responses:
        '200':
          description: Viewer-specific reaction state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostReactionStateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createPostReaction
      tags: [Social]
      summary: Create or update a post reaction
      description: Reaction lifecycle route documented by the Flutter integration ledger. Verify accepted reaction values and request body against Backend implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensibleObject' }
      responses:
        '200': { description: Reaction accepted or updated. }
        '201': { description: Reaction created. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePostReaction
      tags: [Social]
      summary: Remove the authenticated viewer's post reaction
      responses:
        '200': { description: Reaction removed. }
        '204': { description: Reaction removed with no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/social/posts/{postId}/reposts:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPostRepostState
