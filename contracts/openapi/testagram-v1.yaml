  /api/social/notifications/stream:
    get:
      operationId: streamNotifications
      tags: [Notifications]
      summary: Stream authenticated user's new notifications
      description: Server-sent events are read directly from the canonical Backend PostgreSQL notification inbox. The stream is read-only, does not mark inbox items read, and supports replay using Last-Event-ID. Requires the Testagram-native access JWT.
      security:
        - testagramBearer: []
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          description: Opaque replay cursor returned in the SSE id field.
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Server-sent notification events.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/notifications:
    get:
      operationId: listNotifications
