              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/social/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: markNotificationRead
