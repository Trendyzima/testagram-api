  /api/me/profile:
    get:
      operationId: getMyProfile
      tags: [Social]
      summary: Read the authenticated user's canonical Testagram profile
      description: Requires a Testagram-native access JWT. Backend resolves the canonical Testagram UUID from the verified live PostgreSQL session and account record; clients must not supply or substitute a user ID.
      responses:
        '200':
          description: Current canonical profile and viewer relationship flags.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data, error, request_id]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, user_id, username, display_name, bio, website, location, social_links, avatar_key, avatar_url, cover_key, cover_url, protected_account, followers_count, following_count, follow_status, is_following, is_followed_by, can_view_posts, is_self]
                    properties:
                      id: { type: string, format: uuid }
                      user_id: { type: string, format: uuid }
                      username: { type: string }
                      display_name: { type: string }
                      bio: { type: string }
                      website: { type: string }
                      location: { type: string, maxLength: 120 }
                      social_links:
                        type: object
                        additionalProperties: false
                        properties:
                          x: { type: string, maxLength: 256 }
                          twitter: { type: string, maxLength: 256 }
                          instagram: { type: string, maxLength: 256 }
                          linkedin: { type: string, maxLength: 256 }
                          facebook: { type: string, maxLength: 256 }
                      avatar_key: { type: string }
                      avatar_url: { type: string }
                      cover_key: { type: string }
                      cover_url: { type: string }
                      protected_account: { type: boolean }
                      followers_count: { type: integer, minimum: 0 }
                      following_count: { type: integer, minimum: 0 }
                      follow_status: { type: string, enum: ["", pending, accepted] }
                      is_following: { type: boolean }
                      is_followed_by: { type: boolean }
                      can_view_posts: { type: boolean }
                      is_self: { type: boolean }
                  error: { type: 'null' }
                  request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The authenticated account profile is unavailable.
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: updateMyProfile
      tags: [Social]
      summary: Update the authenticated user's canonical profile
      description: Backend validates the Testagram-native access JWT, live session, active account, profile fields and ownership/readiness of uploaded public image assets. Clients upload media through the Backend media gateway first; raw object keys are never accepted unless owned and ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, bio, website, location, avatar_key, cover_key, social_links]
              properties:
                display_name: { type: string, maxLength: 80 }
                bio: { type: string, maxLength: 500 }
                website: { type: string, maxLength: 2048, format: uri }
                location: { type: string, maxLength: 120 }
                avatar_key: { type: string, maxLength: 512 }
                cover_key: { type: string, maxLength: 512 }
                social_links:
                  type: object
                  additionalProperties: false
                  maxProperties: 5
                  properties:
                    x: { type: string, maxLength: 256 }
                    twitter: { type: string, maxLength: 256 }
                    instagram: { type: string, maxLength: 256 }
                    linkedin: { type: string, maxLength: 256 }
                    facebook: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Updated canonical profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/me/federation:
    get:
      operationId: getMyFederationPreference
      tags: [Federation]
      summary: Read the authenticated user's federation preference
      description: Returns the canonical Backend preference. Enabling federation requires username discovery to be enabled.
      responses:
        '200':
          description: Current federation preference.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data, error, request_id]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [enabled]
                    properties:
                      enabled: { type: boolean }
                  error: { type: 'null' }
                  request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: updateMyFederationPreference
      tags: [Federation]
      summary: Update the authenticated user's federation preference
      description: Backend validates the Testagram-native access session, live account status and username discoverability. This endpoint changes preference only; it does not create a separate Mastodon account or bypass federation rollout gates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated federation preference.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, data, error, request_id]
                properties:
                  ok: { const: true }
                  data:
                    type: object
                    additionalProperties: false
                    required: [enabled]
                    properties:
                      enabled: { type: boolean }
                  error: { type: 'null' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The account must be public and username-discoverable before federation can be enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/federation/subscriptions:
    get:
      operationId: listRemoteAuthorSubscriptions
      tags: [Federation]
      summary: List this user's remote author subscriptions
      description: Returns only subscriptions owned by the authenticated canonical Testagram user. Remote actors remain distinct from local accounts.
      security:
        - testagramBearer: []
      responses:
        '200':
          description: Active remote author subscriptions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createRemoteAuthorSubscription
      tags: [Federation]
      summary: Subscribe to a remote ActivityPub or Bluesky author
      description: Requires a native Testagram access session. Backend validates canonical HTTPS ActivityPub actor URIs or Bluesky DIDs, scopes the subscription to the authenticated user and asks the private Federation service to resolve the remote identity. A subscription is not a local account or a follow grant.
      security:
        - testagramBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol, identity]
              properties:
                protocol: { type: string, enum: [activitypub, bluesky] }
                identity: { type: string, minLength: 1, maxLength: 2048 }
                handle: { type: string, maxLength: 256 }
      responses:
        '202':
          description: Subscription accepted for remote identity resolution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/federation/subscriptions/{subscription_id}:
    delete:
      operationId: removeRemoteAuthorSubscription
      tags: [Federation]
      summary: Remove one of the authenticated user's remote author subscriptions
      description: Soft-removes only the subscription owned by the current canonical Testagram user. It does not delete the remote actor or affect other users.
      security:
        - testagramBearer: []
      parameters:
        - in: path
          name: subscription_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Subscription removal result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/tv/channels:
    get:
      operationId: listTvChannels
      x-testagram-status: proposed-not-implemented
      tags: [TV]
      summary: List the normalized public TV catalogue
      description: |
        Backend-owned catalogue read model. Data Centre may ingest and normalize
        upstream feeds, but Flutter must never call upstream sources or Data
        Centre private APIs. This response MUST NOT contain an upstream stream
        URL, provider credential, signed playback URL or private origin detail.
        Proposed contract only until the Backend handler and wire tests ship.
      security: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string, maxLength: 2048 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: country
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - in: query
          name: category
          schema: { type: string, maxLength: 64 }
        - in: query
          name: language
          schema: { type: string, maxLength: 16 }
        - in: query
          name: query
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Stable normalized channel page; no source URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvChannelPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/tv/channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 256 }
    get:
      operationId: getTvChannel
      x-testagram-status: proposed-not-implemented
      tags: [TV]
      summary: Get normalized TV channel metadata
      security: []
      responses:
        '200':
          description: Channel metadata without upstream or signed playback URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvChannel' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/tv/channels/{channelId}/playback:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 256 }
    post:
      operationId: createTvPlaybackGrant
      x-testagram-status: proposed-not-implemented
      tags: [TV]
      summary: Create a short-lived viewer-authorized playback grant
      description: |
        Backend authenticates the viewer and checks channel visibility,
        entitlement, moderation, geography and source health. Caller-supplied
        visibility flags, source URLs and object keys are forbidden. CDN must
        validate a separate, narrow Backend issuer assertion before creating
        the playback URL. Playback signing and issuer credentials are distinct.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                playback_profile:
                  type: string
                  enum: [auto, low, standard, high]
                  default: auto
      responses:
        '200':
          description: Short-lived CDN playback grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvPlaybackGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Channel is not available to this viewer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/capability:
    post:
      operationId: dispatchCapability
      tags: [Social]
      summary: Dispatch an authenticated Backend capability
      description: Routes a bounded capability request to the same native Backend handlers used by first-class API operations. Supported capabilities are explicitly allow-listed; unknown capabilities are rejected. Prefer first-class routes for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capability, input]
              properties:
                capability: { type: string, minLength: 1, maxLength: 128 }
                input:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Capability-specific result envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/polls:
    get:
      operationId: listSocialPolls
      tags: [Social]
      summary: List active and closed polls
      description: Optional authentication personalizes has_voted. Returns polls ordered newest first. Offset pagination is bounded; limit defaults to 20 and must be 1–50, offset defaults to 0 and must be 0–10000.
      security: [{}, { testagramBearer: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Poll page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Request origin is not allowed. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createSocialPoll
      tags: [Social]
      summary: Create a poll
      description: Requires an active authenticated account. Question is 5–500 characters, description at most 1000 characters, options count 2–8 with each option 1–200 characters. Rate limited to five creations per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, options]
              properties:
                question: { type: string, minLength: 5, maxLength: 500 }
                description: { type: string, maxLength: 1000 }
                options:
                  type: array
                  minItems: 2
                  maxItems: 8
                  items: { type: string, minLength: 1, maxLength: 200 }
                ends_at: { type: [string, 'null'], format: date-time }
                media_object_key: { type: string, maxLength: 512 }
      responses:
        '201':
          description: Poll created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Account is not active or origin is not allowed. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/polls/{poll_id}:
    parameters:
      - in: path
        name: poll_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSocialPoll
      tags: [Social]
      summary: Read a poll
      description: Optional authentication personalizes has_voted. Invalid or unavailable poll IDs are not disclosed.
      security: [{}, { testagramBearer: [] }]
      responses:
        '200':
          description: Poll details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/polls/{poll_id}/vote:
    parameters:
      - in: path
        name: poll_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: voteSocialPoll
      tags: [Social]
      summary: Cast one vote in a poll
      description: Requires an active authenticated account. A user may vote once per poll. Closed polls and invalid option IDs return conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [option_id]
              properties:
                option_id: { type: string, format: uuid }
      responses:
        '200':
          description: Vote recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollVoteEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The user has already voted, the poll is closed, or the option does not belong to the poll.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/posts/{post_id}:
    parameters:
      - in: path
        name: post_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSocialPost
      tags: [Social]
      summary: Read a privacy-filtered post
      description: Requires an authenticated active account. Protected-account, follower visibility and block checks are enforced before post/media details are returned. Private media authorization headers are viewer-scoped.
      responses:
        '200':
          description: Post and authorized media metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialPostEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/posts/{post_id}/view:
    parameters:
      - in: path
        name: post_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordSocialPostView
      tags: [Social]
      summary: Record a privacy-filtered post view
      description: Authentication is optional. Anonymous viewers may record views only for public posts; authenticated viewers may also view posts visible to their account. Backend enforces visibility and follower access, applies a per-viewer rate limit, increments the view count and records signed-in browsing history. Clients should de-duplicate view events within a playback session.
      security:
        - testagramBearer: []
        - {}
      responses:
        '200':
          description: View recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensibleObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/posts/{post_id}/interactions/{kind}:
    parameters:
      - in: path
        name: post_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [likes, reposts, quotes] }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    get:
      operationId: listSocialPostInteractions
      tags: [Social]
      summary: List people who liked, reposted or quoted a post
      description: Requires authentication and a successful privacy check for the target post. Results are newest first, limited to 100. quote-likes is explicitly not implemented.
      responses:
        '200':
          description: Interaction page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostInteractionsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/bookmarks:
    get:
      operationId: getSocialBookmarksFeed
      tags: [Social, Feed]
      summary: Retrieve the authenticated user's bookmarked posts
      description: >-
        Requires an active authenticated Testagram account. Returns the same normalized, visibility-filtered
        feed envelope as the home timeline, restricted to posts bookmarked by the viewer. The Backend
        rechecks post visibility, blocks, mutes, moderation, deletion and media authorization before returning
        results. The route always uses chronological ordering; the cursor is opaque and must be reused only
        with this endpoint and viewer.
      parameters:
        - in: query
          name: before
          required: false
          schema: { type: string, maxLength: 2048 }
          description: Opaque cursor returned by the previous bookmarks page.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Authorized bookmarked-post page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnifiedFeedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/suggestions:
    get:
      operationId: getSocialAccountSuggestions
      tags: [Social]
      summary: Discover recommended Testagram accounts
      description: >-
        Requires an active authenticated Testagram account. Returns discoverable active accounts ranked by
        mutual accepted followers, recent public posting activity, follower count and stable tie-breakers.
        Protected accounts, the viewer, existing or pending follow relationships, blocks and mutes are excluded.
        Suggestions are a bounded first page, not a paginated global directory.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
          description: Maximum number of suggested accounts.
      responses:
        '200':
          description: Privacy-filtered account suggestions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialSuggestionsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/profiles/{user_id}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSocialProfile
      tags: [Social]
      summary: Read an active profile
      description: Requires an authenticated active account. Non-discoverable profiles, blocked relationships and protected-account rules are enforced; unavailable profiles return the same 404 response.
      responses:
        '200':
          description: Canonical profile and viewer relationship state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/profiles/{user_id}/connections:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: kind
        required: true
        schema: { type: string, enum: [followers, following] }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      - in: query
        name: cursor
        schema: { type: string, maxLength: 512 }
    get:
      operationId: listSocialProfileConnections
      tags: [Social]
      summary: List privacy-filtered followers or following
      description: Requires authentication. Cursor is an opaque base64url cursor; only accepted followers are returned. Protected and non-discoverable account visibility is enforced.
      responses:
        '200':
          description: Connection page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileConnectionsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/profiles/{user_id}/posts:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      - in: query
        name: before
        description: Opaque cursor returned by the previous page.
        schema: { type: string, maxLength: 1024 }
    get:
      operationId: listSocialProfilePosts
      tags: [Social]
      summary: List visible posts for a profile
      description: Requires authentication. Protected-account, follower visibility and block rules are applied before returning posts and authorized media URLs.
      responses:
        '200':
          description: Profile post page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilePostsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/threads/{thread_id}/likes/toggle:
    parameters:
      - in: path
        name: thread_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: toggleThreadLike
      tags: [Threads]
      summary: Toggle the authenticated user's like on a thread
      description: Requires an active authenticated account. Private threads are hidden from non-owners. Rate limited to 60 actions per minute.
      responses:
        '200':
          description: Current like state after the toggle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadLikeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/threads/{thread_id}/reposts/toggle:
    parameters:
      - in: path
        name: thread_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: toggleThreadRepost
      tags: [Threads]
      summary: Toggle the authenticated user's repost on a thread
      description: Requires an active authenticated account. Private threads are hidden from non-owners. Rate limited to 30 actions per minute.
      responses:
        '200':
          description: Current repost state after the toggle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadRepostEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/threads/{thread_id}/bookmarks/toggle:
    parameters:
      - in: path
        name: thread_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: toggleThreadBookmark
      tags: [Threads]
      summary: Toggle the authenticated user's bookmark on a thread
      description: Requires an active authenticated account. Private threads are hidden from non-owners. Rate limited to 60 actions per minute.
      responses:
        '200':
          description: Current bookmark state after the toggle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadBookmarkEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/threads/{thread_id}/media:
    parameters:
      - in: path
        name: thread_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: attachThreadMedia
      tags: [Threads]
      summary: Attach a ready public media asset to a thread
      description: Requires an active authenticated account and ownership of the thread and media asset. Only ready public media is accepted; duplicate attachments and the 20-file limit return conflict. The client uploads through the Backend media gateway and submits the returned object key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Media attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadMediaEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate attachment or thread media limit reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/knowledge/topics:
    get:
      operationId: listKnowledgeTopics
      tags: [Knowledge]
      summary: Discover curated Knowledge topics
      description: Requires a Testagram-native session. Returns active curated topics only. Search and counts are viewer-safe; follower counts exclude inactive accounts and question counts apply the same visibility policy as the question feed.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
        - in: query
          name: after
          description: Opaque keyset cursor returned as next_cursor; currently the last topic slug.
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      responses:
        '200':
          description: Viewer-safe curated topic page.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [items, has_more, next_cursor]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/KnowledgeTopic' }
                      has_more: { type: boolean }
                      next_cursor: { type: string }
                  error: { type: [object, 'null'] }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/knowledge/topics/{topic_slug}:
    get:
      operationId: getKnowledgeTopic
      tags: [Knowledge]
      summary: Read a curated Knowledge topic
      parameters:
        - in: path
          name: topic_slug
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      responses:
        '200':
          description: Topic details and current viewer follow state.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/KnowledgeTopic' }
                  error: { type: [object, 'null'] }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/knowledge/topics/{topic_slug}/follow:
    post:
      operationId: followKnowledgeTopic
      tags: [Knowledge]
      summary: Follow a curated Knowledge topic
      description: Idempotent for an existing follow. Requires a native session and is rate limited.
      parameters:
        - in: path
          name: topic_slug
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      responses:
        '200':
          description: Topic is followed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [slug, is_following]
                    properties:
                      slug: { type: string }
                      is_following: { type: boolean, const: true }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: unfollowKnowledgeTopic
      tags: [Knowledge]
      summary: Unfollow a curated Knowledge topic
      description: Idempotent when the viewer is not currently following the topic.
      parameters:
        - in: path
          name: topic_slug
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      responses:
        '200':
          description: Topic is no longer followed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [slug, is_following]
                    properties:
                      slug: { type: string }
                      is_following: { type: boolean, const: false }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/knowledge/topics/{topic_slug}/questions:
    get:
      operationId: listKnowledgeTopicQuestions
      tags: [Knowledge]
      summary: List questions tagged with a topic
      parameters:
        - in: path
          name: topic_slug
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        - in: query
          name: status
          schema: { type: string, enum: [all, open, answered], default: all }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: before
          description: Opaque keyset cursor returned as next_cursor.
          schema: { type: string }
      responses:
        '200':
          description: Viewer-authorized topic question page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeQuestionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/knowledge/questions:
    get:
      operationId: listKnowledgeQuestions
      tags: [Knowledge]
      summary: List viewer-authorized Knowledge questions
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [all, open, answered], default: all }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: mine
          schema: { type: boolean, default: false }
        - in: query
          name: following
          schema: { type: boolean, default: false }
        - in: query
          name: topics_following
          description: Restrict to questions tagged with at least one active topic the viewer follows.
          schema: { type: boolean, default: false }
        - in: query
          name: before
          description: Opaque keyset cursor returned as next_cursor.
          schema: { type: string }
      responses:
        '200':
          description: Viewer-authorized Knowledge question page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeQuestionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createKnowledgeQuestion
      tags: [Knowledge]
      summary: Publish a moderated Knowledge question
      description: Requires a native session, an active curated topic catalog when topic_slugs are supplied, and a safe idempotency key. Question creation, topic assignment and the idempotency record are atomic. Moderation is fail-closed; content requiring review is not published.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 8, maxLength: 180 }
                body: { type: string, maxLength: 20000, default: '' }
                visibility: { type: string, enum: [public, followers, private], default: public }
                language: { type: string, maxLength: 32, default: '' }
                topic_slugs:
                  type: array
                  maxItems: 5
                  uniqueItems: true
                  items: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      responses:
        '201':
          description: Question published with topic assignments.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id, author_id, title, body, visibility, status, topic_slugs]
                    properties:
                      id: { type: string, format: uuid }
                      author_id: { type: string, format: uuid }
                      title: { type: string }
                      body: { type: string }
                      visibility: { type: string, enum: [public, followers, private] }
                      status: { type: string, const: open }
                      topic_slugs: { type: array, items: { type: string } }
                  request_id: { type: string }
        '200': { description: Idempotent replay of a previously published question. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Idempotency key was already used for different content. }
        '422': { description: Content requires review and was not published. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/knowledge/questions/{question_id}:
    get:
      operationId: getKnowledgeQuestion
      tags: [Knowledge]
      summary: Read a viewer-authorized question and its answers
      parameters:
        - in: path
          name: question_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Question, active topics, visible answers and owner capability.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id, author_id, title, body, visibility, status, topics, answers, can_accept_answer]
                    properties:
                      id: { type: string, format: uuid }
                      author_id: { type: string, format: uuid }
                      title: { type: string }
                      body: { type: string }
                      visibility: { type: string, enum: [public, followers, private] }
                      status: { type: string, enum: [open, answered, closed] }
                      accepted_answer_id: { type: string, format: uuid }
                      topics: { type: array, items: { type: object, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } } }
                      answers: { type: array, items: { $ref: '#/components/schemas/KnowledgeAnswer' } }
                      can_accept_answer: { type: boolean }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/knowledge/questions/{question_id}/answers:
    post:
      operationId: createKnowledgeAnswer
      tags: [Knowledge]
      summary: Submit a moderated answer to an open question
      description: Requires a native session and a safe idempotency key. Moderation is fail-closed. Answers are separate Knowledge records, not social post replies.
      parameters:
        - in: path
          name: question_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        '201': { description: Answer created. }
        '200': { description: Idempotent replay of an existing answer. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Question is closed or idempotency key conflicts. }
        '422': { description: Content requires review and was not published. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/knowledge/questions/{question_id}/answers/{answer_id}/accept:
    post:
      operationId: acceptKnowledgeAnswer
      tags: [Knowledge]
      summary: Accept an answer as the question author
      description: Only the question author may accept a live answer written by another account. The question update is transactional.
      parameters:
        - in: path
          name: question_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: answer_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Answer accepted and question marked answered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Only the question author may accept an answer. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Answer is not acceptable for this question. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/social/lists:
    get:
      operationId: listSocialLists
      tags: [Social]
      summary: List the current viewer's curated Lists
      description: Returns only Lists owned by the authenticated Testagram account. Results are bounded to 100 and pinned Lists appear first.
      responses:
        '200':
          description: Viewer-owned Lists.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SocialList' } }
                  request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createSocialList
      tags: [Social]
      summary: Create a curated List
      description: Creates a private List by default. Visibility may be private, unlisted or public. Only the owner can manage membership and delete the List.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                description: { type: string, maxLength: 280, default: '' }
                visibility: { type: string, enum: [private, unlisted, public], default: private }
      responses:
        '201':
          description: List created.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/SocialList' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/lists/{list_id}:
    get:
      operationId: getSocialList
      tags: [Social]
      summary: Read a List visible to the current viewer
      parameters:
        - in: path
          name: list_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List details and owner capability.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/SocialList'
                      - type: object
                        required: [is_owner]
                        properties:
                          is_owner: { type: boolean }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteSocialList
      tags: [Social]
      summary: Delete an owned List
      parameters:
        - in: path
          name: list_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Owned List soft-deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/lists/{list_id}/pin:
    put:
      operationId: updateSocialListPin
      tags: [Social]
      summary: Pin or unpin an owned List
      description: Updates the current user's own List pin state. A maximum of five Lists may be pinned. Repeating the same state is idempotent.
      security:
        - testagramBearer: []
      parameters:
        - in: path
          name: list_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pinned]
              properties:
                pinned: { type: boolean }
      responses:
        '200':
          description: Pin state updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [list_id, pinned]
                    properties:
                      list_id: { type: string, format: uuid }
                      pinned: { type: boolean }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Five pinned Lists already exist. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/lists/{list_id}/members:
    get:
      operationId: listSocialListMembers
      tags: [Social]
      summary: List privacy-filtered members of a List
      parameters:
        - in: path
          name: list_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active, viewer-visible List members; blocked and inaccessible protected accounts are excluded.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    required: [items, owner_id]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SocialListMember' } }
                      owner_id: { type: string, format: uuid }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: addSocialListMember
      tags: [Social]
      summary: Add an eligible account to an owned List
      description: Only the owner may add members. The Backend enforces account discoverability, protected-account follow state, block relationships and a serialized 500-member cap. Duplicate additions are idempotent.
      parameters:
        - in: path
          name: list_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200': { description: Member added or already present. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: List or member is unavailable to the viewer. }
        '409': { description: List has reached its 500-member capacity. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/social/lists/{list_id}/members/{member_id}:
    delete:
      operationId: removeSocialListMember
      tags: [Social]
      summary: Remove a member from a List
      description: The List owner may remove any member; a member may remove themselves. The route is idempotent only when a matching membership exists.
      parameters:
        - in: path
          name: list_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: member_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Member removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }


  /api/video/channels:
    get:
      operationId: listCreatorVideoChannels
      tags: [TV]
      summary: List creator channels for the authenticated account
      security: [{ testagramBearer: [] }]
      responses:
        '200':
          description: Owner-scoped channel list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createCreatorVideoChannel
      tags: [TV]
      summary: Create a creator channel
      security: [{ testagramBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handle, name]
              properties:
                handle: { type: string, minLength: 3, maxLength: 40, pattern: '^[a-z0-9._-]+$' }
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Creator channel created
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/video/uploads:
    get:
      operationId: listCreatorVideoUploads
      tags: [TV]
      summary: List the authenticated creator's video uploads
      description: Returns only uploads owned by the authenticated Testagram account. The owner is derived from the native session; callers cannot provide an owner ID. Data Centre remains private behind the Backend proxy.
      security: [{ testagramBearer: [] }]
      responses:
        '200':
          description: Owner-scoped creator video list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, channel_id, channel_handle, channel_name, title, description, visibility, status, duration_ms, width, height, views, likes, comments, created_at, updated_at, published_at]
                      properties:
                        id: { type: string, format: uuid }
                        channel_id: { type: string, format: uuid }
                        channel_handle: { type: string }
                        channel_name: { type: string }
                        title: { type: string }
                        description: { type: string }
                        visibility: { type: string, enum: [private, public] }
                        status: { type: string }
                        duration_ms: { type: integer, minimum: 0 }
                        width: { type: integer, minimum: 0 }
                        height: { type: integer, minimum: 0 }
                        views: { type: integer, minimum: 0 }
                        likes: { type: integer, minimum: 0 }
                        comments: { type: integer, minimum: 0 }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                        published_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
    post:
      operationId: uploadCreatorVideo
      tags: [TV]
      summary: Stream a private creator video upload
      description: Multipart uploads require Content-Length and are limited to 20 GiB. New uploads are private; processing and publishing are separate owner-scoped operations.
      security: [{ testagramBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [video, channel_id, title]
              properties:
                video: { type: string, format: binary }
                channel_id: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                visibility: { type: string, enum: [private] }
      responses:
        '202':
          description: Upload accepted for private processing
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '411': { description: Content-Length is required }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/video/uploads/{video_id}:
    get:
      operationId: getCreatorVideoUploadStatus
      tags: [TV]
      summary: Read owner-scoped video processing status
      security: [{ testagramBearer: [] }]
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Video processing status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteCreatorVideoUpload
      tags: [TV]
      summary: Delete an owned creator video and its media
      description: Deletes the owner-scoped video and its stored original, HLS and poster media after processing has stopped. Repeated deletion of an already-missing ID is idempotent for an authenticated caller; non-owned IDs return not found. Active upload or transcode jobs return conflict.
      security: [{ testagramBearer: [] }]
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Video and associated media metadata deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Video processing is still active; retry after processing completes }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/video/uploads/{video_id}/publish:
    post:
      operationId: publishCreatorVideo
      tags: [TV]
      summary: Explicitly publish an owner video after processing is ready
      security: [{ testagramBearer: [] }]
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Video publication result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Video is not ready to publish or publication conflicts with current state }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }


  /api/video/feed:
    get:
      operationId: getPublicVideoFeed
      tags: [TV]
      summary: List public videos that are ready for playback
      security: []
      responses:
        '200':
          description: Public ready video feed
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        '502': { description: Private video service unavailable }
  /api/video/uploads/{video_id}/view:
    post:
      operationId: recordVideoView
      tags: [TV]
      summary: Record a deduplicated public video view
      security: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Playback-Session
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '202': { description: View accepted; duplicate playback sessions are not counted twice }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Video is not publicly available }
  /api/video/uploads/{video_id}/like:
    post:
      operationId: likeVideo
      tags: [TV]
      summary: Like a public video as the authenticated account
      security: [{ testagramBearer: [] }]
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Like state recorded
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Video not found }
  /api/video/uploads/{video_id}/comments:
    get:
      operationId: listVideoComments
      tags: [TV]
      summary: List comments for a public video
      security: [{ testagramBearer: [] }]
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Video comments
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createVideoComment
      tags: [TV]
      summary: Add a comment to a public video
      security: [{ testagramBearer: [] }]
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
              additionalProperties: false
      responses:
        '200':
          description: Comment accepted
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/video/uploads/{video_id}/manifest:
    get:
      operationId: getVideoPlaybackManifest
      tags: [TV]
      summary: Resolve a signed HLS master manifest for a public video
      security: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '307':
          description: Redirect to the Backend-proxied HLS master playlist with a signed short-lived playback token
          headers:
            Location: { schema: { type: string } }
        '404': { description: Video is not publicly available }
        '502': { description: Private video service unavailable }
  /api/video/uploads/{video_id}/hls/{file}:
    get:
      operationId: getVideoHlsSegment
      tags: [TV]
      summary: Stream a signed HLS playlist or media segment through Backend
      security: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: file
          in: path
          required: true
          description: ASCII HLS filename; path separators, traversal segments and characters outside letters, digits, dot, underscore and hyphen are rejected.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: Range
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
        - name: If-Range
          in: header
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Signed HLS playlist or video segment streamed by the Backend
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
            video/mp2t:
              schema: { type: string, format: binary }
        '206':
          description: Partial video segment returned for a byte-range request.
          headers:
            Content-Range: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string } }
          content:
            video/mp2t:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: "Missing, malformed or expired signed playback token" }
        '404': { description: Segment not found }
        '502': { description: Private video service unavailable }

components:
  securitySchemes:
    testagramBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Testagram-native short-lived access JWT. Backend validates signature, issuer, audience, expiry, session state, token version and account status. No external-provider fallback is accepted for end-user routes.
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    SocialList:
      type: object
      required: [id, owner_id, name, description, visibility, created_at, members_count]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 280 }
        visibility: { type: string, enum: [private, unlisted, public] }
        pinned: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        members_count: { type: integer, minimum: 0, maximum: 500 }
    SocialListMember:
      type: object
      required: [user_id, username, added_at, is_self]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: [string, 'null'] }
        avatar_key: { type: [string, 'null'] }
        added_at: { type: string, format: date-time }
        is_self: { type: boolean }
    KnowledgeTopic:
      type: object
      required: [id, slug, name, description, followers_count, questions_count, is_following]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        followers_count: { type: integer, minimum: 0 }
        questions_count: { type: integer, minimum: 0 }
        is_following: { type: boolean }
    KnowledgeQuestionPage:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data:
          type: object
          required: [items, has_more, next_cursor]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, author_id, title, body, visibility, status, answers_count, topics, author]
                properties:
                  id: { type: string, format: uuid }
                  author_id: { type: string, format: uuid }
                  title: { type: string, maxLength: 180 }
                  body: { type: string, maxLength: 20000 }
                  visibility: { type: string, enum: [public, followers, private] }
                  status: { type: string, enum: [open, answered, closed] }
                  accepted_answer_id: { type: [string, 'null'], format: uuid }
                  answers_count: { type: integer, minimum: 0 }
                  topics:
                    type: array
                    items:
                      type: object
                      required: [slug, name]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                  author:
                    type: object
                    required: [id, username, protected_account]
                    properties:
                      id: { type: string, format: uuid }
                      username: { type: string }
                      display_name: { type: [string, 'null'] }
                      avatar_key: { type: [string, 'null'] }
                      avatar_url: { type: string }
                      protected_account: { type: boolean }
            has_more: { type: boolean }
            next_cursor: { type: string }
        request_id: { type: string }
    KnowledgeAnswer:
      type: object
      required: [id, question_id, author_id, body, revision_number, created_at, updated_at, accepted, author]
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        body: { type: string, maxLength: 20000 }
        revision_number: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        accepted: { type: boolean }
        author:
          type: object
          required: [id, username]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            display_name: { type: [string, 'null'] }
            avatar_key: { type: [string, 'null'] }
            avatar_url: { type: string }
    NativeAuthResponse:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [access_token, refresh_token, token_type, expires_in, user]
          properties:
            access_token: { type: string, minLength: 32 }
            refresh_token: { type: string, minLength: 40 }
            token_type: { type: string, const: Bearer }
            expires_in: { type: integer, const: 900 }
            user:
              type: object
              required: [id, email]
              properties:
                id: { type: string, format: uuid }
                email: { type: string, format: email }
        error: { type: 'null' }
        request_id: { type: string }
    GenericAuthMessage:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean, const: true }
        message: { type: string }
    PollOption:
      type: object
      additionalProperties: false
      required: [id, label, position, votes]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 200 }
        position: { type: integer, minimum: 0 }
        votes: { type: integer, minimum: 0 }
    Poll:
      type: object
      additionalProperties: false
      required: [id, question, description, status, ends_at, created_at, total_votes, options, has_voted]
      properties:
        id: { type: string, format: uuid }
        question: { type: string, minLength: 5, maxLength: 500 }
        description: { type: string, maxLength: 1000 }
        status: { type: string, enum: [open, closed] }
        ends_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        total_votes: { type: integer, minimum: 0 }
        options:
          type: array
          items: { $ref: '#/components/schemas/PollOption' }
        has_voted: { type: boolean }
        media_url: { type: string, format: uri }
        media_type: { type: string }
    PollEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data: { $ref: '#/components/schemas/Poll' }
        error: { type: 'null' }
        request_id: { type: string }
    PollListEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [items, next_offset, has_more]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Poll' }
            next_offset: { type: integer, minimum: 0 }
            has_more: { type: boolean }
        error: { type: 'null' }
        request_id: { type: string }
    PollVoteEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [poll_id, option_id, voted]
          properties:
            poll_id: { type: string, format: uuid }
            option_id: { type: string, format: uuid }
            voted: { const: true }
        error: { type: 'null' }
        request_id: { type: string }
    SocialProfile:
      type: object
      additionalProperties: false
      required: [id, user_id, username, display_name, bio, website, location, social_links, avatar_key, avatar_url, avatar_storage_provider, cover_key, cover_url, protected_account, followers_count, following_count, follow_status, is_following, is_followed_by, can_view_posts, is_self]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        website: { type: string }
        location: { type: string }
        social_links: { type: object, additionalProperties: { type: string } }
        avatar_key: { type: string }
        avatar_url: { type: string }
        avatar_storage_provider: { type: string }
        cover_key: { type: string }
        cover_url: { type: string }
        protected_account: { type: boolean }
        followers_count: { type: integer, minimum: 0 }
        following_count: { type: integer, minimum: 0 }
        follow_status: { type: string, enum: ["", pending, accepted] }
        is_following: { type: boolean }
        is_followed_by: { type: boolean }
        can_view_posts: { type: boolean }
        is_self: { type: boolean }
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data: { $ref: '#/components/schemas/SocialProfile' }
        error: { type: 'null' }
        request_id: { type: string }
    ProfileConnection:
      type: object
      additionalProperties: false
      required: [id, username, display_name, avatar_url, bio, follow_status, is_following, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
        bio: { type: string }
        follow_status: { type: string, enum: ["", pending, accepted] }
        is_following: { type: boolean }
        created_at: { type: string, format: date-time }
    ProfileConnectionsEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [items, next_cursor, has_more, kind]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProfileConnection' }
            next_cursor: { type: string }
            has_more: { type: boolean }
            kind: { type: string, enum: [followers, following] }
        error: { type: 'null' }
        request_id: { type: string }
    ProfilePost:
      type: object
      additionalProperties: false
      required: [id, user_id, content, visibility, media_ids, media_urls, media_content_types, is_video, is_following, language, created_at, likes_count, replies_count, reposts_count, author, origin]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        content: { type: string }
        visibility: { type: string, enum: [public, followers, private] }
        media_ids: { type: array, items: { type: string } }
        media_urls: { type: array, items: { type: string, format: uri } }
        media_content_types: { type: array, items: { type: string } }
        media_auth_headers: { type: object, additionalProperties: { type: string } }
        is_video: { type: boolean }
        is_following: { type: boolean }
        language: { type: string }
        created_at: { type: string, format: date-time }
        likes_count: { type: integer, minimum: 0 }
        replies_count: { type: integer, minimum: 0 }
        reposts_count: { type: integer, minimum: 0 }
        author: { type: object, additionalProperties: true }
        origin: { type: string, const: local }
    ProfilePostsEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [posts, has_more, next_cursor]
          properties:
            posts:
              type: array
              items: { $ref: '#/components/schemas/ProfilePost' }
            has_more: { type: boolean }
            next_cursor: { type: string }
        error: { type: 'null' }
        request_id: { type: string }
    SocialSuggestion:
      type: object
      additionalProperties: false
      required: [id, username, display_name, avatar_url, bio, mutual_followers_count, recent_posts_count, followers_count, is_following, reason]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, maxLength: 64 }
        display_name: { type: string, maxLength: 256 }
        avatar_url: { type: string }
        bio: { type: string, maxLength: 500 }
        mutual_followers_count: { type: integer, minimum: 0 }
        recent_posts_count: { type: integer, minimum: 0 }
        followers_count: { type: integer, minimum: 0 }
        is_following: { type: boolean }
        reason: { type: string, enum: [followed_by_people_you_follow, active_in_testagram, popular_in_testagram] }
    SocialSuggestionsEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/SocialSuggestion' }
        error: { type: 'null' }
        request_id: { type: string }
    UnifiedFeedEnvelope:
      type: object
      required: [ok, data, error, request_id]
      properties:
        ok: { const: true }
        data: { $ref: '#/components/schemas/UnifiedFeedPage' }
        error: { type: 'null' }
        request_id: { type: string }
    UnifiedFeedPage:
      type: object
      required: [posts, next_cursor, has_more, ranking_mode, feed_mode]
      properties:
        posts:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/UnifiedFeedItem' }
        next_cursor: { type: [string, 'null'], maxLength: 2048 }
        has_more: { type: boolean }
        ranking_mode: { type: string, enum: [algorithm, chronological] }
        feed_mode: { type: string, enum: [for_you, following, latest, media, discover, federated] }
        video_only: { type: boolean }
        bookmarks_only: { type: boolean }
        list_id: { type: [string, 'null'], format: uuid }
    UnifiedFeedItem:
      type: object
      additionalProperties: true
      required: [id, content, created_at, origin, author]
      properties:
