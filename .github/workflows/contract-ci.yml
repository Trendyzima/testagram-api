name: API contract CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Checkout Backend source for route audit
        run: git clone --depth 1 https://github.com/Trendyzima/Testagram-backend-.git ../Testagram-backend-
      - run: npm run lint:openapi
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:backend-routes

  validate-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: packages/dart
        run: dart pub get
      - working-directory: packages/dart
        run: dart format --set-exit-if-changed .
      - working-directory: packages/dart
        run: dart analyze
      - working-directory: packages/dart
        run: dart test
