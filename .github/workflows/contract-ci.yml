name: API contract CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run sources:checkout
      - run: npm run lint:openapi
      - run: npm run lint:internal-openapi
      - run: npm run audit:tv-health-contract
      - run: npm run typecheck
      - run: npm run build:sdk
      - run: npm test
      - run: npm run audit:backend-routes
      - run: npm run audit:cross-repo

  validate-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: packages/dart
        run: dart pub get
      - working-directory: packages/dart
        run: dart format .
      - working-directory: packages/dart
        run: dart analyze
      - working-directory: packages/dart
        run: dart test
